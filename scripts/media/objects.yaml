# BKG 3-D specimen library — taxonomy v1
#
# One entry per specimen object. This file is the single source of truth for the
# media pipeline in this folder: 01 reads it to build image prompts, 02 turns the
# images into meshes, 03 publishes the results, preview.py renders contact sheets.
#
# Fields
#   slug         kebab-case id. Becomes the filename stem AND the storage path
#                (assets/bkg/3d/<slug>.glb) AND the brand_assets.slug. Never reuse.
#   title        human title for the library row.
#   domain       trade bucket. Also emitted as a tag on the library row.
#   aesthetic    photoreal | ceramic. photoreal objects get BASE_STYLE wrapped
#                around prompt_hint; ceramic objects use prompt_hint verbatim
#                (they carry their own full studio description + brand glaze).
#   prompt_hint  the object description. For photoreal this is substituted into
#                BASE_STYLE's {obj}; for ceramic it IS the whole prompt.
#   status       ready      — generated and accepted, do not regenerate
#                regenerate — generated but rejected, prompt fixed, re-run it
#                todo       — never generated
#
# Only `regenerate` and `todo` rows are picked up by a default pipeline run.
# Pass --all to force ready rows through again.

